name: "Static Analysis"

on: [push]

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: apt-get install packages
      run: sudo apt-get update -qq &&
           sudo apt-get install --no-install-recommends -y
               bison
               build-essential
               check
               clang
               flex
               git
               gperf
               llvm
               pkg-config

    - name: Get env.sh
      run: |
           mkdir projects
           wget -O projects/env.sh https://raw.githubusercontent.com/netsurf-browser/netsurf/refs/heads/master/docs/env.sh

    - name: Build and install project deps
      env:
        TARGET: ${{ github.event.repository.name }}
        REPO_BASE_URI: https://github.com/netsurf-browser
        TARGET_WORKSPACE: "${{ github.workspace }}/projects" # Same as "$(pwd)/projects"
      run: |
          source projects/env.sh
          ns-clone -d -s -b ${GITHUB_REF_NAME}
          ns-make-libs install

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    - name: Build Library
      env:
        TARGET_WORKSPACE: "${{ github.workspace }}/projects" # Same as "$(pwd)/projects"
      run: |
          source projects/env.sh
          make -j"$(nproc)"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  scan-build:
    name: scan-build
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: apt-get install packages
      run: sudo apt-get update -qq &&
           sudo apt-get install --no-install-recommends -y
               bison
               build-essential
               check
               clang
               clang-tools
               flex
               git
               gperf
               jq
               llvm
               pkg-config

    - name: Get env.sh
      run: |
           mkdir projects
           wget -O projects/env.sh https://raw.githubusercontent.com/netsurf-browser/netsurf/refs/heads/master/docs/env.sh

    - name: Build and install project deps
      env:
        TARGET: ${{ github.event.repository.name }}
        REPO_BASE_URI: https://github.com/netsurf-browser
        TARGET_WORKSPACE: "${{ github.workspace }}/projects" # Same as "$(pwd)/projects"
      run: |
          source projects/env.sh
          ns-clone -d -s -b ${GITHUB_REF_NAME}
          ns-make-libs install

    - name: Run scan-build
      env:
        TARGET_WORKSPACE: "${{ github.workspace }}/projects" # Same as "$(pwd)/projects"
      run: |
          source projects/env.sh
          scan-build -sarif --keep-empty -o sarif make -j"$(nproc)"

    # Clang writes one SARIF run per translation unit but GitHub only allows one run.
    - name: Merge SARIF files
      run: |
          find sarif -name '*.sarif' -print0 | xargs -0 jq -s '
            [.[].runs[]] as $runs
            | {
                "$schema": .[0]["$schema"],
                version: "2.1.0",
                runs: [($runs[0] | del(.artifacts)) + {
                  tool: {driver: ($runs[0].tool.driver + {
                    rules: ([$runs[].tool.driver.rules[]?] | unique_by(.id))
                  })},
                  results: [$runs[].results[]? | del(.ruleIndex)
                    | walk(if type == "object" and has("uri")
                           then del(.index) else . end)]
                }]
              }' > scan-build.sarif
          jq -e '.runs | length == 1' scan-build.sarif

    - name: Upload scan-build SARIF
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: scan-build.sarif
        category: scan-build
